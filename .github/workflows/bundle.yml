name: Databricks bundle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    # Never give repository secrets to fork PRs. Same-repository PR authors are trusted.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      # Main deployments cannot overlap; PRs use separate concurrency groups.
      group: ${{ github.event_name == 'workflow_dispatch' && 'production-bundle' || format('bundle-pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
        with:
          version: '0.8.24'
          enable-cache: false
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        with:
          version: '0.289.1' # Supports bundle plan
      - name: Build wheel
        shell: bash
        run: |
          if ! uv build --wheel >"$RUNNER_TEMP/uv-build.log" 2>&1; then
            echo 'Wheel build failed (output withheld).'
            exit 1
          fi
          echo 'Wheel build passed (output withheld).'
      - name: Check required secrets
        shell: bash
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_prod_user_name: ${{ secrets.DATABRICKS_PROD_USER_NAME }}
        run: |
          if [[ -z "$DATABRICKS_HOST" || -z "$DATABRICKS_TOKEN" || -z "$BUNDLE_VAR_prod_user_name" ]]; then
            echo 'Required Databricks secrets are missing.'
            exit 1
          fi
      - name: Validate production bundle
        shell: bash
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_prod_user_name: ${{ secrets.DATABRICKS_PROD_USER_NAME }}
        run: |
          # CLI output may contain private paths or identities. Never print or upload it.
          if ! databricks bundle validate --target prod >"$RUNNER_TEMP/bundle-validate.log" 2>&1; then
            echo 'Production bundle validation failed (output withheld).'
            exit 1
          fi
          echo 'Production bundle validation passed (output withheld).'
      - name: Plan production bundle
        shell: bash
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_prod_user_name: ${{ secrets.DATABRICKS_PROD_USER_NAME }}
        run: |
          if ! databricks bundle plan --target prod >"$RUNNER_TEMP/bundle-plan.log" 2>&1; then
            echo 'Production bundle plan failed (output withheld).'
            exit 1
          fi
          echo 'Production bundle plan passed (output withheld).'
      - name: Deploy production bundle
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_prod_user_name: ${{ secrets.DATABRICKS_PROD_USER_NAME }}
        run: |
          if ! databricks bundle deploy --target prod >"$RUNNER_TEMP/bundle-deploy.log" 2>&1; then
            echo 'Production bundle deployment failed (output withheld).'
            exit 1
          fi
          echo 'Production bundle deployment passed (output withheld).'
